<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Updated – Finance Advisor</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">

    <style>
        :root {
            --accent: #22d3ee;
            --accent-green: #22c55e;
            --accent-green-dark: #16a34a;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #020617 0%, #020617 40%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Background glow blobs */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 999px;
            filter: blur(65px);
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .blob-1 { background: #0ea5e9; top: -120px; left: -80px; }
        .blob-2 { background: #4f46e5; bottom: -150px; right: -60px; }
        .blob-3 { background: #22c55e; top: 50%; left: 70%; }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(12, 17, 32, 0.96);
            padding: 32px 28px 26px;
            border-radius: 18px;
            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.25),
                0 25px 70px rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(18px);
            text-align: center;
            animation: fadeUp 0.9s ease-out;
        }

        .icon-wrap {
            width: 60px;
            height: 60px;
            border-radius: 999px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 0%, #22c55e, #16a34a);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.7);
        }

        .icon-wrap span {
            font-size: 32px;
        }

        h2 {
            margin: 4px 0 6px;
            font-size: 22px;
            font-weight: 600;
            color: #f9fafb;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 11px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(34, 197, 94, 0.35);
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .sub-link {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .sub-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .sub-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="bg-glow">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="card">
    <div class="icon-wrap">
        <span>✔</span>
    </div>

    <h2>Password Updated</h2>
    <p>Your password has been changed successfully. You can now log in with your new password.</p>

    <!-- Change href to "/login" if your Spring controller uses that path -->
    <a href="login.html" class="btn">Back to Login</a>

    <div class="sub-link">
        Didn't make this change? <a href="contact-support.html">Contact support</a>
    </div>
</div>

</body>
</html>
