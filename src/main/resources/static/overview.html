<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finance Advisor – Overview</title>

    <!-- Google font (optional) -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", system-ui, sans-serif;
            background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
            color: #f9fafb;
            text-align: left;
        }

        .wrapper {
            max-width: 960px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .tag {
            font-size: 12px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #7dd3fc;
            margin-bottom: 10px;
            animation: fade 1.2s ease-out;
        }

        h1 {
            font-size: 40px;
            line-height: 1.2;
            margin: 0 0 14px;
            animation: slideDown 1.2s ease-out;
        }

        h1 span {
            color: #22c55e;
        }

        .subtitle {
            max-width: 560px;
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 26px;
            animation: fade 1.4s ease-out;
        }

        .btn-primary {
            padding: 12px 26px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #022c22;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(34, 197, 94, 0.35);
            animation: pop 1.4s ease-out;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .trust-row {
            margin-top: 22px;
            font-size: 13px;
            color: #9ca3af;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            animation: fade 1.6s ease-out;
        }

        .trust-row span::before {
            content: "• ";
            color: #22c55e;
        }

        @keyframes fade {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes slideDown {
            from {opacity: 0; transform: translateY(-16px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes pop {
            from {opacity: 0; transform: scale(0.9);}
            to {opacity: 1; transform: scale(1);}
        }
    </style>
</head>
<body>

<div class="wrapper">
    <p class="tag">PERSONAL FINANCE, SIMPLIFIED</p>

    <h1>
        Manage your <span>money</span><br>
        with clarity and confidence.
    </h1>

    <p class="subtitle">
        Track your income and expenses in one place, understand your spending behaviour,
        and receive personalised suggestions to grow your savings.
    </p>

    <button class="btn-primary" onclick="goToSignUp()">Start Tracking Free</button>
    <div class="trust-row">
        <span>No credit card required</span>
        <span>Encrypted &amp; secure</span>
        <span>Trusted by students &amp; professionals</span>
    </div>
</div>
<script>
    function goToSignUp() {
// Change this to your Spring Boot login mapping if needed (e.g. "/login")
window.location.href = "signup.html";
}
</script>
</body>
</html>
