<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password – Finance Advisor</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #000 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(15, 23, 42, 0.85);
            padding: 30px 35px;
            width: 350px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
            animation: fadeUp 1s ease-out;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        h2 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        p {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: #0f172a;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .btn {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #001a0f;
            transition: 0.2s;
            box-shadow: 0 12px 28px rgba(34, 197, 94, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            margin-top: 16px;
            text-align: center;
        }

        .back-link a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Forgot Password?</h2>
    <p>Enter your registered email and we’ll send you an OTP to reset your password.</p>

    <form action="/send-reset-email" method="post">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="Enter your email">

        <input type="submit" value="Send OTP" class="btn" type="submit"/>
    </form>

    <div class="back-link">
        <a href="/login.html">← Back to Login</a>
    </div>
</div>

</body>
</html>
