<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Created | Finance Advisor</title>
    <style>
        :root {
            --bg-main: #020617;
            --accent: #3b82f6;
            --accent-2: #22c55e;
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
            --border-soft: #1e293b;
            --radius-lg: 18px;
            --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617 55%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* glowing blobs */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            z-index: -1;
        }

        .glow-1 {
            width: 420px;
            height: 420px;
            background: #3b82f6;
            top: -120px;
            left: -80px;
        }

        .glow-2 {
            width: 460px;
            height: 460px;
            background: #22c55e;
            bottom: -140px;
            right: -80px;
        }

        .card {
            width: 90%;
            max-width: 460px;
            padding: 32px 30px;
            border-radius: var(--radius-lg);
            background: rgba(15,23,42,0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(148,163,184,0.4);
            box-shadow: var(--shadow-soft);
            text-align: center;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(59,130,246,0.4);
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0.75); }
            100% { transform: scale(1); }
        }

        .icon span {
            font-size: 36px;
            font-weight: bold;
            color: white;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 12px 30px rgba(34,197,94,0.35);
            transition: 0.22s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(34,197,94,0.45);
        }
    </style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="card">
    <div class="icon">
        <span>✔</span>
    </div>

    <h2 class="title">Account Created Successfully!</h2>

    <p class="text">
        Your Finance Advisor account is now active.
        You can now log in to track your income & expenses, view insights, and receive smart financial suggestions.
    </p>

    <a href="login.html" class="btn">Proceed to Login</a>
</div>

</body>
</html>
