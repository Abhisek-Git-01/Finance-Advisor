<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password – Finance Advisor</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">

    <style>
        :root {
            --accent: #22d3ee;
            --accent-green: #22c55e;
            --accent-green-dark: #16a34a;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-subtle: #1f2937;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #020617 0%, #020617 40%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Background Glow */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .blob {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 999px;
            filter: blur(65px);
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .blob-1 { background: #0ea5e9; top: -120px; left: -80px; }
        .blob-2 { background: #4f46e5; bottom: -150px; right: -60px; }
        .blob-3 { background: #22c55e; top: 50%; left: 70%; }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(12, 17, 32, 0.96);
            padding: 32px 30px;
            border-radius: 18px;
            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.25),
                0 25px 70px rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(18px);
            animation: fadeUp 0.9s ease-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
            color: white;
        }

        p {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Floating Input */
        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px;
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .input-group input::placeholder { color: transparent; }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.5);
        }

        .input-group label {
            position: absolute;
            top: 12px;
            left: 12px;
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
            transition: 0.2s ease;
            padding: 0 4px;
        }

        /* Floating animation */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -8px;
            left: 10px;
            background: #0f172a;
            font-size: 11px;
            color: var(--accent);
        }

        /* Error Message */
        #errorMsg {
            margin-top: -10px;
            margin-bottom: 10px;
            min-height: 16px;
            color: #f87171;
            font-size: 12px;
            text-align: center;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 12px 28px rgba(34, 197, 94, 0.35);
            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="bg-glow">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="card">
    <h2>Reset Password</h2>
    <p>Create a new secure password for your account.</p>

    <form action="/update-password" method="post" onsubmit="return validateMatch()">

        <div class="input-group">
            <input type="password" id="newPassword" name="newPassword" required placeholder=" ">
            <label>New Password</label>
        </div>

        <div class="input-group">
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder=" ">
            <label>Confirm Password</label>
        </div>

        <div id="errorMsg"></div>

        <button class="btn" type="submit">Update Password</button>

    </form>
</div>

<script>
    function validateMatch() {
        let p1 = document.getElementById("newPassword").value;
        let p2 = document.getElementById("confirmPassword").value;
        let msg = document.getElementById("errorMsg");

        if (p1 !== p2) {
            msg.textContent = "Passwords do not match. Please re-enter.";
            return false;
        }

        msg.textContent = "";
        return true;
    }
</script>

</body>
</html>
