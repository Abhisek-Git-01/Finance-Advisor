<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | Finance Advisor</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        /* ====== RESET ====== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root{
            --bg-1: #020617;
            --bg-2: #0f172a;
            --panel: rgba(15,23,42,0.92);
            --muted: #9ca3af;
            --text: #f9fafb;
            --accent-a: #38bdf8;
            --accent-b: #6366f1;
            --accent-c: #f97316;
            --glass-border: rgba(148,163,184,0.12);
            --success: #34d399;
            --danger: #f97373;
        }
        html.light {
            --bg-1: #f6f7fb;
            --bg-2: #e6eefb;
            --panel: linear-gradient(180deg,#ffffff,#f8fafc);
            --muted: #6b7280;
            --text: #0b1220;
            --glass-border: rgba(15,23,42,0.04);
            --accent-a: #0ea5e9;
            --accent-b: #6366f1;
            --accent-c: #fb923c;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, var(--bg-2) 0, var(--bg-1) 45%, #000 100%);
            color: var(--text);
            padding: 24px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* background orbs */
        .floating-orb { position: fixed; border-radius: 999px; filter: blur(40px); opacity: 0.32; animation: float 16s ease-in-out infinite alternate; z-index: -1; }
        .orb-1{ width:260px;height:260px;top:-60px;left:-60px;background:var(--accent-a); }
        .orb-2{ width:320px;height:320px;bottom:-80px;right:-40px;background:var(--accent-b); animation-delay:4s; }
        .orb-3{ width:200px;height:200px;bottom:20%;left:10%;background:var(--accent-c); animation-delay:8s; }
        @keyframes float { 0%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(20px,-20px,0) scale(1.05);} 100%{transform:translate3d(-20px,20px,0) scale(1.1);} }

        /* card */
        .otp-card{
            width:100%; max-width:520px; border-radius:20px; padding:28px; background:var(--panel);
            box-shadow: 0 18px 45px rgba(15,23,42,0.6), 0 0 0 1px var(--glass-border); position: relative;
            overflow: hidden; transform: translateY(0); transition: transform .18s ease;
            backdrop-filter: blur(6px);
        }
        .otp-header{ text-align:center; margin-bottom:16px; }
        .otp-title{ font-size:1.5rem; font-weight:700; letter-spacing:0.02em; margin-bottom:6px; color:var(--text); }
        .otp-subtitle{ font-size:0.95rem; color:var(--muted); }
        .otp-subtitle span{ color: var(--text); font-weight:600; display:block; margin-top:6px; font-size:0.95rem; }

        /* progress / countdown */
        .countdown-wrap{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:10px; }
        .progress-circle{
            width:48px; height:48px; border-radius:999px; position:relative; display:inline-grid; place-items:center;
            background: conic-gradient(var(--accent-a) 0deg, rgba(255,255,255,0.06) 0deg);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
            font-weight:700; color:var(--text); font-size:0.9rem;
        }
        .countdown-text{ font-size:0.9rem; color:var(--muted); }

        /* form */
        form { margin-top: 18px; }
        .otp-input-label{ font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; margin-bottom:8px; display:block; text-align:center; }
        .otp-grid{ display:flex; gap:12px; justify-content:center; margin:10px 0 6px; }
        .otp-digit{
            width:52px; height:52px; border-radius:12px; border:1px solid rgba(0,0,0,0.12);
            display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:700;
            background: rgba(255,255,255,0.02); color:var(--text); outline:none; text-align:center;
        }
        html.light .otp-digit{ background: #fff; border:1px solid rgba(15,23,42,0.06); color:var(--text); }

        .hint{ text-align:center; color:var(--muted); font-size:0.9rem; margin-top:8px; margin-bottom:8px; }
        .error-message{ font-size:0.85rem; color:var(--danger); text-align:center; margin-top:6px; display:none; }

        /* buttons */
        .btn-submit{
            width:100%; border:none; border-radius:999px; padding:12px 16px; margin-top:10px;
            font-size:0.98rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
            background: linear-gradient(135deg,var(--accent-a),var(--accent-b)); color: #071127; cursor:pointer;
            box-shadow: 0 16px 35px rgba(37,99,235,0.18); transition: transform .12s ease, opacity .12s ease;
        }
        .btn-submit:disabled{ opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }

        .footer-text{ margin-top:14px; font-size:0.9rem; color:var(--muted); text-align:center; }
        .footer-text a{ color:var(--accent-a); text-decoration:none; font-weight:600; }
        .resend-inline{ display:inline-flex; gap:8px; align-items:center; justify-content:center; }

        /* style the resend button to look like a link */
        .resend-button-like {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: var(--accent-a);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.92rem;
            text-decoration: underline;
        }
        .resend-button-like:disabled { opacity: .6; cursor: not-allowed; text-decoration: none; }

        /* theme toggle */
        .topbar{ display:flex; justify-content:flex-end; gap:10px; }
        .theme-toggle{
            border-radius:999px; padding:8px 10px; cursor:pointer; border:1px solid rgba(255,255,255,0.06);
            background:transparent; color:var(--text); font-weight:600; font-size:0.9rem;
        }

        /* small screens */
        @media (max-width:480px){
            .otp-digit{ width:44px; height:44px; font-size:1.1rem; }
            .progress-circle{ width:44px; height:44px; font-size:0.85rem; }
            .otp-card{ padding:18px; border-radius:14px; }
        }
    </style>
</head>
<body>
<div class="floating-orb orb-1" aria-hidden="true"></div>
<div class="floating-orb orb-2" aria-hidden="true"></div>
<div class="floating-orb orb-3" aria-hidden="true"></div>

<div class="otp-card" role="main" aria-labelledby="verify-heading">
    <div class="topbar" aria-hidden="true">
        <button id="themeToggle" class="theme-toggle" title="Toggle light / dark">Toggle Theme</button>
    </div>

    <div class="otp-header">
        <h1 id="verify-heading" class="otp-title">Verify OTP</h1>
        <p class="otp-subtitle">We’ve sent a 6-digit code to<br><span id="emailSpan"><!-- server render --> ${email}</span></p>
    </div>

    <form id="otpForm" action="/forgotPasswordOtpVerify" method="post" autocomplete="off" novalidate>
        <!-- Hidden email passed from previous step -->
        <input type="hidden" name="email" id="emailHidden" value="${email}">

        <!-- Hidden combined OTP field -->
        <input type="hidden" name="otpInput" id="otpInput" value="">

        <label class="otp-input-label" for="digit-1">One-Time Password</label>

        <div class="otp-grid" role="group" aria-label="Enter 6 digit code">
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-1" aria-label="Digit 1" autocomplete="one-time-code" />
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-2" aria-label="Digit 2" autocomplete="one-time-code" />
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-3" aria-label="Digit 3" autocomplete="one-time-code" />
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-4" aria-label="Digit 4" autocomplete="one-time-code" />
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-5" aria-label="Digit 5" autocomplete="one-time-code" />
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-digit" id="digit-6" aria-label="Digit 6" autocomplete="one-time-code" />
        </div>

        <div class="countdown-wrap" aria-live="polite">
            <div id="progress" class="progress-circle" role="status" aria-hidden="false">60</div>
            <div class="countdown-text" id="countdownText">seconds until resend</div>
        </div>

        <p class="hint">Enter the <strong>6-digit OTP</strong> from your email to complete verification.</p>
        <p id="errorMsg" class="error-message" role="alert" aria-hidden="true"></p>

        <button id="submitBtn" class="btn-submit" type="submit" disabled>Verify & Continue</button>

        <p class="footer-text">
            Didn’t get the code?
            <span class="resend-inline" id="resendArea">
                <span id="resendCounter" style="display:inline;"></span>

                <!-- Resend POST form - initially hidden; looks like a link -->
                <form action="/send-reset-email" method="post" id="resendForm" style="display:none; margin:0;">
                    <!-- include email so server knows which account -->
                    <input type="hidden" name="email" value="${email}">
                    <button type="submit" id="resendBtn" class="resend-button-like">Resend OTP</button>
                </form>
            </span>
        </p>
    </form>
</div>

<script>
    (function(){
        // ====== Config ======
        const RESEND_SECONDS = 60;
        const TIMER_KEY = 'fa_otp_resend_ts';      // stores epoch seconds when resend allowed
        const THEME_KEY = 'fa_theme_pref';

        // ====== Elements ======
        const digits = Array.from(document.querySelectorAll('.otp-digit'));
        const submitBtn = document.getElementById('submitBtn');
        const otpInputHidden = document.getElementById('otpInput');
        const form = document.getElementById('otpForm');
        const progress = document.getElementById('progress');
        const countdownText = document.getElementById('countdownText');
        const resendCounter = document.getElementById('resendCounter');
        const errorMsg = document.getElementById('errorMsg');
        const themeToggle = document.getElementById('themeToggle');
        const resendForm = document.getElementById('resendForm');
        const resendBtn = document.getElementById('resendBtn');

        // ====== Theme handling (persist) ======
        function applyTheme(theme){
            if(theme === 'light') document.documentElement.classList.add('light');
            else document.documentElement.classList.remove('light');
            localStorage.setItem(THEME_KEY, theme);
            themeToggle.textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
        }
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        applyTheme(savedTheme);
        themeToggle.addEventListener('click', () => {
            const now = document.documentElement.classList.contains('light') ? 'dark' : 'light';
            applyTheme(now);
        });

        // ====== OTP input UX ======
        digits.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const v = e.target.value;
                // accept only first digit
                if(!/^[0-9]$/.test(v)){
                    e.target.value = v.replace(/[^0-9]/g,'');
                    return;
                }
                // move to next
                if(v && idx < digits.length - 1) digits[idx + 1].focus();
                checkComplete();
            });

            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && !e.target.value && idx > 0){
                    digits[idx - 1].focus();
                } else if(e.key === 'ArrowLeft' && idx > 0){
                    digits[idx - 1].focus();
                } else if(e.key === 'ArrowRight' && idx < digits.length - 1){
                    digits[idx + 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                const onlyDigits = paste.replace(/\D/g,'').slice(0, digits.length - idx);
                for(let i=0; i<onlyDigits.length; i++){
                    if(idx + i < digits.length) digits[idx + i].value = onlyDigits[i];
                }
                const nextIndex = Math.min(digits.length - 1, idx + onlyDigits.length);
                digits[nextIndex].focus();
                checkComplete();
            });
        });

        function checkComplete(){
            const val = digits.map(d => d.value || '').join('');
            otpInputHidden.value = val;
            const allFilled = val.length === digits.length && /^\d+$/.test(val);
            submitBtn.disabled = !allFilled;
            if(allFilled){
                errorMsg.style.display = 'none';
                errorMsg.setAttribute('aria-hidden', 'true');
            }
        }

        // autofocus first empty field on load
        window.addEventListener('load', () => {
            const firstEmpty = digits.find(d => !d.value);
            if(firstEmpty) firstEmpty.focus();
        });

        // ====== Form submit: client validation (server still authoritative) ======
        form.addEventListener('submit', (e) => {
            if(otpInputHidden.value.length !== digits.length){
                e.preventDefault();
                errorMsg.textContent = 'Please enter the 6-digit code.';
                errorMsg.style.display = 'block';
                errorMsg.setAttribute('aria-hidden', 'false');
                return false;
            }
            // allow submit — server will verify OTP
        });

        // ====== Resend timer with persistence ======
        function getNowSeconds(){ return Math.floor(Date.now() / 1000); }
        function setResendAllowedAt(ts){ localStorage.setItem(TIMER_KEY, ts.toString()); }
        function getResendAllowedAt(){ const v = localStorage.getItem(TIMER_KEY); return v ? parseInt(v,10) : 0; }

        function startTimerUI(remaining){
            // remaining in seconds (>=0)
            updateProgress(remaining);
            if(remaining <= 0){
                showResendForm();
                return;
            } else {
                hideResendForm();
            }

            if(window.__fa_otp_timer) clearInterval(window.__fa_otp_timer);

            window.__fa_otp_timer = setInterval(() => {
                remaining--;
                if(remaining <= 0){
                    clearInterval(window.__fa_otp_timer);
                    updateProgress(0);
                    showResendForm();
                } else {
                    updateProgress(remaining);
                }
            }, 1000);
        }

        function updateProgress(secondsLeft){
            const pct = Math.max(0, Math.min(RESEND_SECONDS, secondsLeft)) / RESEND_SECONDS;
            const degrees = Math.round(360 * pct);
            progress.style.background = `conic-gradient(var(--accent-a) ${degrees}deg, rgba(255,255,255,0.06) ${degrees}deg)`;
            progress.textContent = secondsLeft;
            countdownText.textContent = secondsLeft === 1 ? 'second until resend' : 'seconds until resend';
            resendCounter.textContent = secondsLeft > 0 ? `${secondsLeft}s` : '';
        }

        function showResendForm(){
            resendForm.style.display = 'inline';
            resendCounter.style.display = 'none';
            progress.style.background = `conic-gradient(var(--success) 360deg, rgba(255,255,255,0.02) 0deg)`;
            progress.textContent = '✓';
            countdownText.textContent = 'You can resend now';
        }
        function hideResendForm(){
            resendForm.style.display = 'none';
            resendCounter.style.display = 'inline';
        }

        // initialize timer on load
        (function initTimer(){
            const allowedAt = getResendAllowedAt(); // epoch seconds when allowed
            const now = getNowSeconds();
            let remaining = allowedAt > now ? (allowedAt - now) : 0;
            startTimerUI(remaining);
        })();

        // When user submits the resendForm, set next allowed time and disable button to avoid double posts
        resendForm.addEventListener('submit', (e) => {
            // set next allowed time now + RESEND_SECONDS (client-side UX protective)
            const next = getNowSeconds() + RESEND_SECONDS;
            setResendAllowedAt(next);

            // disable button and show immediate feedback (browser will navigate)
            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            // start client-side timer proactively (even though navigation likely follows)
            startTimerUI(RESEND_SECONDS);
            // allow natural form submission to the server
        });

        // Accessibility: Enter on last digit submits if complete
        digits[digits.length - 1].addEventListener('keydown', (e) => {
            if(e.key === 'Enter'){
                checkComplete();
                if(!submitBtn.disabled){
                    form.requestSubmit();
                }
            }
        });

        // (Optional) If you want AJAX resend instead of full page navigation,
        // let me know and I'll convert the form to fetch() with CSRF handling.

    })();
</script>
</body>
</html>
